name: Lint and Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning
          ignore_paths: >-
            synology/scripts

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  bats:
    name: Bats unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run tests
        run: bats tests/

  python-tests:
    name: Python unit tests (webserver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Image vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    # Depends on the build smoke so we only spend scan time on an image that
    # already builds. The amd64-only load below reuses the same gha buildx
    # cache populated by docker-build, so this is a near-instant rebuild.
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build single-arch image for scanning (load to local daemon)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          # Trivy scans a single concrete image; build amd64 only and load it
          # into the local Docker daemon so the scanner can reference it.
          platforms: linux/amd64
          push: false
          load: true
          tags: gitpreserver:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gitpreserver:scan
          format: table
          exit-code: "1"
          # Fail only on vulnerabilities that have a fix available — i.e. ones we
          # can actually act on by updating a package. A freshly built
          # debian-slim base always carries dozens of unfixed OS CVEs (jq,
          # libperl, libpython, expat, …) with no upstream patch; gating on those
          # would make the scan permanently red with no actionable remedy.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Accepted/suppressed findings are documented in .trivyignore at the
          # repo root.
          trivyignores: .trivyignore

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists PR commits and (optionally) comments findings
      # on the PR. It needs these scopes; the workflow-level default of
      # contents-only is not enough on pull_request events.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
