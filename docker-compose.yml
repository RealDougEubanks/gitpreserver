# GitPreserver docker-compose
#
# All three services share an image built from ./docker/Dockerfile, mount the
# same backup volume, and run as the non-root `gitpreserver` user.
#
# Host bind mounts (./backups and ./rclone/rclone.conf) must be readable and
# writable by the container UID/GID. Override with PUID/PGID environment
# variables to match your host user — set them in .env or your shell:
#
#   PUID=$(id -u)  PGID=$(id -g)  docker compose run --rm mirror
#
# rclone.conf is mounted read-only — the image will never modify it.

x-gitpreserver: &gitpreserver
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  restart: "no"
  security_opt:
    - no-new-privileges:true
  # The runtime entrypoint usermods the gitpreserver user to match PUID/PGID
  # and chowns the writable mounts before dropping privileges via gosu. That
  # path needs CHOWN, SETUID, SETGID, FOWNER. Everything else is dropped.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - FOWNER
    - SETUID
    - SETGID

services:

  mirror:
    <<: *gitpreserver
    volumes:
      - ${GITPRESERVER_HOST_BACKUP_DIR:-./backups}:/backups
    command: ["mirror.sh"]

  metadata:
    <<: *gitpreserver
    volumes:
      - ${GITPRESERVER_HOST_BACKUP_DIR:-./backups}:/backups
    command: ["metadata.sh"]
    depends_on:
      mirror:
        condition: service_completed_successfully

  sync:
    <<: *gitpreserver
    volumes:
      - ${GITPRESERVER_HOST_BACKUP_DIR:-./backups}:/backups
      - ${GITPRESERVER_RCLONE_CONFIG:-./rclone/rclone.conf}:/home/gitpreserver/.config/rclone/rclone.conf:ro
    command: ["sync.sh"]
    depends_on:
      metadata:
        condition: service_completed_successfully
