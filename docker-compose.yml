# GitPreserver docker-compose
#
# All services share an image built from ./docker/Dockerfile and run as the
# non-root `gitpreserver` user.
#
# rclone.conf is optional. If GITPRESERVER_RCLONE_CONFIG is not set (or the
# file does not exist), rclone reads remote configuration from environment
# variables (RCLONE_CONFIG_<REMOTE>_<KEY>=value). See docs/daemon-mode.md.
#
# Host bind mounts must be readable/writable by the container UID/GID.
# Set PUID/PGID in .env to match your host user:
#
#   PUID=$(id -u)  PGID=$(id -g)  docker compose run --rm mirror

x-gitpreserver: &gitpreserver
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  restart: "no"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - FOWNER
    - SETUID
    - SETGID

# Shared volume list reused across one-shot services (no rclone.conf required).
x-backup-volumes: &backup-volumes
  - ${GITPRESERVER_HOST_BACKUP_DIR:-./backups}:/backups

# rclone.conf volume — falls back to /dev/null when the file is not provided,
# giving rclone an empty config and letting env vars supply remote definitions.
x-rclone-volume: &rclone-volume
  - ${GITPRESERVER_RCLONE_CONFIG:-/dev/null}:/home/gitpreserver/.config/rclone/rclone.conf:ro

services:

  # -------------------------------------------------------------------------
  # One-shot pipeline services (used by docker compose run / CI)
  # -------------------------------------------------------------------------

  mirror:
    <<: *gitpreserver
    volumes: *backup-volumes
    command: ["mirror.sh"]

  metadata:
    <<: *gitpreserver
    volumes: *backup-volumes
    command: ["metadata.sh"]
    depends_on:
      mirror:
        condition: service_completed_successfully

  sync:
    <<: *gitpreserver
    volumes:
      - ${GITPRESERVER_HOST_BACKUP_DIR:-./backups}:/backups
      - ${GITPRESERVER_RCLONE_CONFIG:-/dev/null}:/home/gitpreserver/.config/rclone/rclone.conf:ro
    command: ["sync.sh"]
    depends_on:
      metadata:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # Daemon service — stays running, runs backups on GITPRESERVER_SCHEDULE,
  # and serves the web UI on port 6033 (configurable via GITPRESERVER_WEB_PORT).
  #
  # Start with:  docker compose up daemon
  # -------------------------------------------------------------------------

  daemon:
    <<: *gitpreserver
    volumes:
      - ${GITPRESERVER_HOST_BACKUP_DIR:-./backups}:/backups
      - ${GITPRESERVER_RCLONE_CONFIG:-/dev/null}:/home/gitpreserver/.config/rclone/rclone.conf:ro
    environment:
      GITPRESERVER_MODE: daemon
    ports:
      - "${GITPRESERVER_WEB_PORT:-6033}:${GITPRESERVER_WEB_PORT:-6033}"
    restart: unless-stopped
